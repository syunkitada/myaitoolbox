openapi: 3.0.3
info:
  title: mybox API
  description: Markdown-based personal project management API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/projects:
    get:
      operationId: listProjects
      summary: List projects
      responses:
        "200":
          description: list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      summary: Register a directory as a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: path does not exist or is not a directory
  /api/projects/paths:
    get:
      operationId: getProjectPaths
      summary: List existing directory paths for project path autocompletion
      parameters:
        - name: prefix
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: candidate directory paths
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/projects/{name}:
    delete:
      operationId: deleteProject
      summary: Remove a project
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: removed
        "404":
          description: project not found
  /api/projects/reorder:
    put:
      operationId: reorderProjects
      summary: Reorder projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderProjectsRequest"
      responses:
        "204":
          description: reordered
  /api/projects/git-status:
    get:
      operationId: getProjectGitStatus
      summary: Get git status summary for all projects
      responses:
        "200":
          description: git status per project
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ProjectGitStatus"
  /api/meta:
    get:
      operationId: getMeta
      summary: Get mybox metadata
      responses:
        "200":
          description: meta information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /api/meta/favorites:
    put:
      operationId: updateFavorite
      summary: Add or remove a favorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFavoriteRequest"
      responses:
        "204":
          description: updated
  /api/meta/recent:
    post:
      operationId: recordRecent
      summary: Record a recently opened file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRecentRequest"
      responses:
        "204":
          description: recorded
  /api/meta/recent/delete:
    post:
      operationId: deleteRecent
      summary: Remove a file from the recent list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRecentRequest"
      responses:
        "204":
          description: removed
  /api/browser/sessions:
    get:
      operationId: getBrowserSession
      summary: Get the current project browser session
      parameters:
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      responses:
        "200":
          description: current session or null
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/BrowserSession"
        "400":
          description: project scope is missing
    post:
      operationId: createBrowserSession
      summary: Start or reuse a project browser session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserSessionRequest"
      responses:
        "200":
          description: reused session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSession"
        "201":
          description: created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSession"
        "409":
          description: an existing session requires explicit user restart
  /api/browser/sessions/{id}/commands:
    post:
      operationId: browserCommand
      summary: Execute a browser worker command
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserCommandRequest"
      responses:
        "200":
          description: command result
          content:
            application/json: {}
  /api/browser/sessions/{id}/approval-mode:
    post:
      operationId: setBrowserApprovalMode
      summary: Set the user-controlled approval mode for this browser session
      description: Auto-safe mode automatically approves AI navigation and heuristically low-risk link, menu, or disclosure clicks. High-impact actions remain approval-gated. Only a local user request may change this setting.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserApprovalModeRequest"
      responses:
        "200":
          description: updated browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSession"
        "400":
          description: unsupported approval mode
        "403":
          description: only an authenticated local user may change this setting
        "404":
          description: browser session not found
  /api/browser/audit:
    get:
      operationId: getBrowserAudit
      summary: List redacted browser audit events for the current project
      parameters:
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
        - name: session_id
          in: query
          required: false
          schema:
            type: string
        - name: event
          in: query
          required: false
          schema:
            type: string
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: command
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive RFC3339 timestamp lower bound.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive RFC3339 timestamp upper bound.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of newest matching events to skip.
      responses:
        "200":
          description: redacted audit events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAuditResponse"
        "400":
          description: invalid filter or missing project scope
        "403":
          description: request is not an authenticated local user request
        "500":
          description: audit log could not be read
  /api/browser/sessions/{id}/control/takeover:
    post:
      operationId: takeOverBrowser
      summary: Give browser control to the user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      responses:
        "200":
          description: updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSession"
  /api/browser/sessions/{id}/control/return:
    post:
      operationId: returnBrowserControl
      summary: Return browser control to the AI agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      responses:
        "200":
          description: updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSession"
  /api/browser/sessions/{id}/approvals/{approval_id}/approve:
    post:
      operationId: approveBrowserAction
      summary: Approve one pending side-effect action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      responses:
        "200":
          description: action result
          content:
            application/json: {}
  /api/browser/sessions/{id}/approvals/{approval_id}/reject:
    post:
      operationId: rejectBrowserAction
      summary: Reject one pending side-effect action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      responses:
        "200":
          description: rejection result
          content:
            application/json: {}
  /api/browser/sessions/{id}/close:
    post:
      operationId: closeBrowserSession
      summary: Close a browser session while retaining its profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      responses:
        "204":
          description: closed
  /api/browser/sessions/{id}/restart:
    post:
      operationId: restartBrowserSession
      summary: Restart a failed browser session while retaining its profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Required unless the X-Project header identifies the project.
      responses:
        "201":
          description: restarted session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSession"
        "403":
          description: only the user can restart a session
        "409":
          description: the session is not in an error state
  /api/browser/profiles/reset:
    post:
      operationId: resetBrowserProfile
      summary: Delete the persistent browser profile for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project]
              properties:
                project:
                  type: string
      responses:
        "204":
          description: reset
  /api/browser/stream:
    get:
      summary: Stream browser JPEG frames and state events over WebSocket
      parameters:
        - name: project
          in: query
          required: false
          schema:
            type: string
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade
  /api/files:
    get:
      operationId: listFiles
      summary: List files in the project directory tree
      parameters:
        - name: show_hidden
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to include hidden files (dotfiles) in the result
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: >
            Directory path relative to the project root. When omitted the
            complete tree is returned, otherwise only the direct children.
      responses:
        "200":
          description: file tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileEntry"
    post:
      operationId: createFile
      summary: Create an empty file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePathRequest"
      responses:
        "204":
          description: created
        "400":
          description: invalid path
        "409":
          description: already exists
  /api/files/search:
    get:
      operationId: searchFiles
      summary: Search text file contents in the project
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Case-insensitive literal search query
        - name: show_hidden
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to include hidden files (dotfiles) in the result
      responses:
        "200":
          description: matching text files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileSearchResponse"
        "400":
          description: missing or empty query
  /api/files/dir:
    post:
      operationId: createDir
      summary: Create an empty directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePathRequest"
      responses:
        "204":
          description: created
        "400":
          description: invalid path
        "409":
          description: already exists
  /api/files/upload:
    post:
      operationId: uploadFiles
      summary: Upload one or more files to a project directory
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                directory:
                  type: string
                  description: Directory path relative to the project root; empty means the project root
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "204":
          description: uploaded
        "400":
          description: invalid multipart form or path
        "413":
          description: upload exceeds the maximum request size
  /api/files/content:
    get:
      operationId: getFileContent
      summary: Get file content
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: file content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "400":
          description: invalid path
        "404":
          description: not found
    put:
      operationId: saveFileContent
      summary: Save file content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileContent"
      responses:
        "204":
          description: saved
  /api/files/move:
    post:
      operationId: moveFile
      summary: Move a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFileRequest"
      responses:
        "204":
          description: moved
        "400":
          description: invalid path
        "404":
          description: not found
  /api/files/copy:
    post:
      operationId: copyFile
      summary: Copy a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFileRequest"
      responses:
        "204":
          description: copied
        "400":
          description: invalid path
        "404":
          description: not found
  /api/files/delete:
    post:
      operationId: deleteFile
      summary: Delete a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePathRequest"
      responses:
        "204":
          description: deleted
        "400":
          description: invalid path
        "404":
          description: not found
  /api/files/git-status:
    get:
      operationId: getFileGitStatus
      summary: Get git status for each file in the project
      responses:
        "200":
          description: per-file git status
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  description: Git status code (staged, modified, untracked, deleted)
  /api/files/execute:
    post:
      operationId: executeFile
      summary: Execute an executable file and return its output
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePathRequest"
      responses:
        "200":
          description: execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileExecuteResult"
        "400":
          description: invalid path or not executable
        "404":
          description: not found
  /api/files/execute/runs:
    get:
      operationId: listFileExecutions
      summary: List server-owned file executions
      responses:
        "200":
          description: execution history for the current project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileExecutionSnapshot"
    post:
      operationId: startFileExecution
      summary: Start a server-owned file execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePathRequest"
      responses:
        "201":
          description: execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileExecutionSnapshot"
        "400":
          description: invalid path
        "404":
          description: not found
        "429":
          description: concurrent file execution limit reached
  /api/files/execute/runs/{id}/stop:
    post:
      operationId: stopFileExecution
      summary: Stop a server-owned file execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: stopped or already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileExecutionSnapshot"
        "404":
          description: execution not found
  /api/files/execute/runs/{id}:
    delete:
      operationId: dismissFileExecution
      summary: Dismiss a completed file execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: dismissed
        "404":
          description: execution not found or still running
  /api/tasks:
    get:
      operationId: listTasks
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: a task with the same name already exists in the project
  /api/task-template:
    get:
      operationId: getTaskTemplate
      summary: Get the rendered task template
      parameters:
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: rendered task template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
  /api/task-triggers:
    post:
      operationId: createTaskTrigger
      summary: Create an automatic task trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskTriggerRequest"
      responses:
        "201":
          description: created task trigger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTrigger"
        "400":
          description: invalid trigger definition
        "409":
          description: trigger already exists
  /api/task-triggers/{id}/run:
    post:
      operationId: runTaskTrigger
      summary: Run a task trigger immediately
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: trigger run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTriggerRun"
        "400":
          description: invalid or disabled trigger
        "404":
          description: trigger not found
        "409":
          description: automation is busy or the generated task name already exists
  /api/tasks/{id}:
    get:
      operationId: getTask
      summary: Get a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: not found
    patch:
      operationId: updateTask
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: a task with the same name already exists in the project
    delete:
      operationId: deleteTask
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: deleted
  /api/tasks/{id}/archive:
    post:
      operationId: archiveTask
      summary: Archive a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: archived
  /api/graph:
    get:
      operationId: getGraph
      summary: Get graph data for Graph View
      parameters:
        - name: path
          in: query
          required: false
          description: Optional root directory to scope the graph to (empty means the whole project)
          schema:
            type: string
      responses:
        "200":
          description: graph data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphData"
  /api/herdr/overview:
    get:
      operationId: getHerdrOverview
      summary: Get herdr workspaces and agents overview
      responses:
        "200":
          description: herdr overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOverview"
  /api/codex/diagnostics:
    get:
      operationId: getCodexDiagnostics
      summary: Get read-only Codex CLI diagnostics for the current project
      responses:
        "200":
          description: Codex diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexDiagnostics"
  /api/codex/diagnostics/content:
    get:
      operationId: getCodexDiagnosticContent
      summary: Read a discovered Codex configuration, instruction, or skill file
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [config, instruction, skill]
        - name: path
          in: query
          required: true
          description: Absolute path returned by the Codex diagnostics endpoint
          schema:
            type: string
      responses:
        "200":
          description: Sanitized or raw file content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexDiagnosticContent"
        "400":
          description: Unsupported content kind or invalid request
        "404":
          description: The requested path is not a discovered readable file
  /api/codex/diagnostics/skill-files:
    get:
      operationId: getCodexSkillFiles
      summary: List files in a discovered Codex skill directory
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute skill directory path returned by the Codex diagnostics endpoint
          schema:
            type: string
      responses:
        "200":
          description: Direct children of the skill directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexSkillFileList"
        "404":
          description: The requested path is not a discovered skill directory
  /api/herdr/agents/start:
    post:
      operationId: startHerdrAgent
      summary: Start a herdr agent in a project tab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrAgentStartRequest"
      responses:
        "200":
          description: started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrAgentStartResponse"
  /api/herdr/agents/read:
    post:
      operationId: readHerdrAgent
      summary: Read agent terminal output
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrReadRequest"
      responses:
        "200":
          description: agent terminal output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrReadResponse"
  /api/herdr/agents/focus:
    post:
      operationId: focusHerdrAgent
      summary: Mark an agent result as seen in herdr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrReadRequest"
      responses:
        "200":
          description: focused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/agents/prompt:
    post:
      operationId: promptHerdrAgent
      summary: Submit a prompt to an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrPromptRequest"
      responses:
        "200":
          description: accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrPromptResponse"
  /api/herdr/agents/scheduled-prompts:
    get:
      operationId: listHerdrScheduledPrompts
      summary: List scheduled prompts for the current project
      responses:
        "200":
          description: scheduled prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledPrompt"
    post:
      operationId: createHerdrScheduledPrompt
      summary: Schedule a prompt for an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHerdrScheduledPromptRequest"
      responses:
        "201":
          description: scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPrompt"
  /api/herdr/agents/scheduled-prompts/{id}:
    delete:
      operationId: deleteHerdrScheduledPrompt
      summary: Cancel a scheduled prompt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: cancelled
        "404":
          description: scheduled prompt not found
  /api/herdr/agents/send-keys:
    post:
      operationId: sendKeysHerdrAgent
      summary: Send key presses to a herdr agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrAgentSendKeysRequest"
      responses:
        "200":
          description: sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/agents/rename:
    post:
      operationId: renameHerdrAgent
      summary: Rename a herdr agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrAgentRenameRequest"
      responses:
        "200":
          description: renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/tabs/create:
    post:
      operationId: createHerdrTab
      summary: Create a herdr tab
      description: >
        When the request names a project and no herdr workspace carries that
        label yet (e.g. herdr holds no tabs/panes at all), the project's first
        workspace is bootstrapped instead; its root tab becomes the new tab.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrTabCreateRequest"
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/tabs/rename:
    post:
      operationId: renameHerdrTab
      summary: Rename a herdr tab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrTabRenameRequest"
      responses:
        "200":
          description: renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/tabs/close:
    post:
      operationId: closeHerdrTab
      summary: Close a herdr tab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrTabCloseRequest"
      responses:
        "200":
          description: closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/panes/split:
    post:
      operationId: splitHerdrPane
      summary: Split a herdr pane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrPaneSplitRequest"
      responses:
        "200":
          description: split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/panes/rename:
    post:
      operationId: renameHerdrPane
      summary: Rename a herdr pane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrPaneRenameRequest"
      responses:
        "200":
          description: renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/panes/read:
    post:
      operationId: readHerdrPane
      summary: Read herdr pane terminal output
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrReadRequest"
      responses:
        "200":
          description: pane terminal output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrReadResponse"
  /api/herdr/panes/close:
    post:
      operationId: closeHerdrPane
      summary: Close a herdr pane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrPaneCloseRequest"
      responses:
        "200":
          description: closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/panes/send-text:
    post:
      operationId: sendTextHerdrPane
      summary: Send literal text to a herdr pane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrPaneSendTextRequest"
      responses:
        "200":
          description: sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
  /api/herdr/panes/send-keys:
    post:
      operationId: sendKeysHerdrPane
      summary: Send key presses to a herdr pane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HerdrPaneSendKeysRequest"
      responses:
        "200":
          description: sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HerdrOpResponse"
components:
  schemas:
    BrowserSession:
      type: object
      required: [id, project, state, owner, url, title, approval_mode]
      properties:
        id:
          type: string
        project:
          type: string
        state:
          type: string
          enum: [starting, running, waiting_user, user_control, approval_pending, paused, error, closed]
        owner:
          type: string
          enum: [user, agent]
        url:
          type: string
        title:
          type: string
        approval_mode:
          type: string
          enum: [manual, auto_safe]
          description: Session-scoped approval mode; defaults to manual and resets when the session is restarted.
        error:
          type: string
          nullable: true
          description: Present when the session is in the error state.
        pending_approval:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BrowserApproval"
    BrowserApproval:
      type: object
      required: [approval_id, action, target]
      properties:
        approval_id:
          type: string
        action:
          type: string
        target:
          type: string
    BrowserApprovalModeRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [manual, auto_safe]
    BrowserAuditEvent:
      type: object
      required: [timestamp, event, project, result]
      properties:
        timestamp:
          type: string
          format: date-time
        event:
          type: string
        project:
          type: string
        session_id:
          type: string
        actor:
          type: string
        command:
          type: string
        result:
          type: string
        reason:
          type: string
    BrowserAuditResponse:
      type: object
      required: [events, total, offset, limit, has_more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/BrowserAuditEvent"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
    BrowserSessionRequest:
      type: object
      properties:
        project:
          type: string
        url:
          type: string
          description: Public HTTPS URL for user-created sessions. Agent-created sessions must start at about:blank and use the approval-gated browser navigate command.
    BrowserCommandRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          enum: [observe, navigate, click, fill, press, scroll, wait, screenshot, input, close_session]
        payload:
          type: object
          additionalProperties: true
    Project:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    CreateProjectRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    ReorderProjectsRequest:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items:
            type: string
    Meta:
      type: object
      required: [project, projects, default_project, tags, favorites, recent_files]
      properties:
        project:
          type: string
        projects:
          type: array
          items:
            type: string
        default_project:
          type: string
        tags:
          type: array
          items:
            type: string
        favorites:
          type: array
          items:
            $ref: "#/components/schemas/Favorite"
        recent_files:
          type: array
          items:
            type: string
    ProjectGitStatus:
      type: object
      required: [dirty, modified, staged, untracked]
      properties:
        dirty:
          type: boolean
          description: Whether the project has any uncommitted changes
        modified:
          type: integer
          description: Number of modified files
        staged:
          type: integer
          description: Number of staged files
        untracked:
          type: integer
          description: Number of untracked files
    Favorite:
      type: object
      required: [project, path]
      properties:
        project:
          type: string
          description: Project containing the favorited path
        path:
          type: string
          description: Path relative to the project root
    UpdateFavoriteRequest:
      type: object
      required: [path, enabled]
      properties:
        path:
          type: string
        enabled:
          type: boolean
        project:
          type: string
          description: Project containing the path; defaults to the current project
    RecordRecentRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    Task:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
        title:
          type: string
          description: Task directory basename (at most 80 Unicode characters). It is derived from id and is not stored in task.md frontmatter.
        status:
          $ref: "#/components/schemas/TaskStatus"
        due:
          type: string
        pending_until:
          type: string
        pending_reason:
          type: string
        tags:
          type: array
          items:
            type: string
        project:
          type: string
        created:
          type: string
          format: date-time
        body:
          type: string
        archived:
          type: boolean
    TaskStatus:
      type: string
      enum: ["todo", "doing", "blocked", "review", "done"]
    CreateTaskRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Task name used to generate the task directory/ID. The resulting directory basename must be at most 80 Unicode characters.
        content:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        due:
          type: string
        tags:
          type: array
          items:
            type: string
    CreateTaskTriggerRequest:
      type: object
      required: [id, task, trigger]
      properties:
        id:
          type: string
          maxLength: 53
          description: Must be short enough that generated task directory IDs stay within 80 characters.
        task:
          $ref: "#/components/schemas/TaskTriggerTask"
        trigger:
          $ref: "#/components/schemas/TaskTriggerCondition"
    TaskTriggerTask:
      type: object
      required: [name, agent_kind]
      properties:
        name:
          type: string
        agent_kind:
          type: string
        prompt:
          type: string
          default: "'$task_file_path' を実施してください。"
        content:
          type: string
    TaskTriggerCondition:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [cron, file_created, manual]
        cron:
          type: string
        timezone:
          type: string
        path:
          type: string
        pattern:
          type: string
    TaskTemplate:
      type: object
      required: [content]
      properties:
        content:
          type: string
    TaskTrigger:
      type: object
      required: [id, type, directory, task_path]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [cron, file_created, manual]
        directory:
          type: string
        task_path:
          type: string
    TaskTriggerRun:
      type: object
      required: [id, project, trigger_id, event_id, status, started_at, finished_at]
      properties:
        id:
          type: string
        project:
          type: string
        trigger_id:
          type: string
        event_id:
          type: string
        status:
          type: string
        task_id:
          type: string
        agent_name:
          type: string
        source_path:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error_message:
          type: string
    UpdateTaskRequest:
      type: object
      properties:
        name:
          type: string
          description: New task name. Renames the task directory/ID, which must be at most 80 Unicode characters, and the returned title is the new directory basename.
        status:
          $ref: "#/components/schemas/TaskStatus"
        due:
          type: string
        tags:
          type: array
          items:
            type: string
    FileEntry:
      type: object
      required: [path, name, kind]
      properties:
        path:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: ["file", "dir"]
        status:
          type: string
          description: Front matter status metadata for markdown files, if present
        executable:
          type: boolean
          description: Whether the file has the executable bit set
    FileSearchResponse:
      type: object
      required: [query, results, total, truncated]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/FileSearchResult"
        total:
          type: integer
          description: Total number of matching files before the response limit
        truncated:
          type: boolean
          description: Whether the response was limited to the first 100 files
    FileSearchResult:
      type: object
      required: [path, line, snippet, match_count]
      properties:
        path:
          type: string
        line:
          type: integer
          description: 1-based line number of the first match
        snippet:
          type: string
          description: Representative line containing the first match
        match_count:
          type: integer
          description: Number of non-overlapping matches in the file
    FileExecuteResult:
      type: object
      required: [path, exit_code, output]
      properties:
        path:
          type: string
        exit_code:
          type: integer
          description: Process exit code (124 when the run timed out)
        output:
          type: string
          description: Combined stdout and stderr of the executed process
        timed_out:
          type: boolean
          description: True when the process was killed after the timeout
    FileExecutionSnapshot:
      type: object
      required: [id, path, status, output, started_at]
      properties:
        id:
          type: string
        path:
          type: string
        status:
          type: string
          enum: [running, completed, failed, stopped]
        output:
          type: string
          description: Recent combined stdout and stderr, capped at 1 MiB
        exit_code:
          type: integer
        timed_out:
          type: boolean
        error:
          type: string
        started_at:
          type: string
          format: date-time
    FileContent:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
    MoveFileRequest:
      type: object
      required: [old_path, new_path]
      properties:
        old_path:
          type: string
        new_path:
          type: string
    FilePathRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    GraphData:
      type: object
      required: [nodes, links]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        links:
          type: array
          items:
            $ref: "#/components/schemas/GraphLink"
    GraphNode:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
    GraphLink:
      type: object
      required: [source, target]
      properties:
        source:
          type: string
        target:
          type: string
    HerdrOverview:
      type: object
      required: [available, workspaces, agents, tabs, panes]
      properties:
        available:
          type: boolean
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/HerdrWorkspace"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/HerdrAgent"
        tabs:
          type: array
          items:
            $ref: "#/components/schemas/HerdrTab"
        panes:
          type: array
          items:
            $ref: "#/components/schemas/HerdrPane"
    CodexDiagnostics:
      type: object
      required: [project, fetched_at, codex, config_files, instructions, skills, skills_truncated, mcp_servers, errors]
      properties:
        project:
          type: string
        fetched_at:
          type: string
          format: date-time
        codex:
          $ref: "#/components/schemas/CodexRuntime"
        config_files:
          type: array
          items:
            $ref: "#/components/schemas/CodexConfigFile"
        instructions:
          type: array
          items:
            $ref: "#/components/schemas/CodexInstructionFile"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/CodexSkill"
        skills_truncated:
          type: boolean
          description: Whether one or more standard Skill roots contained more entries than the response limit
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/CodexMCPServer"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CodexDiagnosticError"
    CodexDiagnosticContent:
      type: object
      required: [kind, scope, path, content, is_symlink, redacted, truncated, size_bytes, fetched_at]
      properties:
        kind:
          type: string
          enum: [config, instruction, skill]
        scope:
          type: string
        path:
          type: string
        is_symlink:
          type: boolean
        content:
          type: string
        redacted:
          type: boolean
        truncated:
          type: boolean
        size_bytes:
          type: integer
          format: int64
        fetched_at:
          type: string
          format: date-time
    CodexSkillFileList:
      type: object
      required: [path, entries, truncated, fetched_at]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CodexSkillFile"
        truncated:
          type: boolean
          description: Whether the directory contains more entries than the response limit
        fetched_at:
          type: string
          format: date-time
    CodexSkillFile:
      type: object
      required: [name, path, kind, size_bytes, is_symlink, target]
      properties:
        name:
          type: string
        path:
          type: string
        kind:
          type: string
          description: file, directory, other, or unavailable
        size_bytes:
          type: integer
          format: int64
        is_symlink:
          type: boolean
        target:
          type: string
          description: Resolved or raw symbolic-link target; empty for regular entries
    CodexRuntime:
      type: object
      required: [status, available, feature_flags, status_reasons]
      properties:
        status:
          type: string
        available:
          type: boolean
        executable_path:
          type: string
        version:
          type: string
        app_server_version:
          type: string
        app_server_status:
          type: string
        auth_mode:
          type: string
        authenticated:
          type: boolean
        model:
          type: string
        model_provider:
          type: string
        reasoning_effort:
          type: string
        sandbox_mode:
          type: string
        approval_policy:
          type: string
        feature_flags:
          type: array
          items:
            type: string
        status_reasons:
          type: array
          description: Safe summaries of the non-OK Codex doctor checks that explain the runtime status
          items:
            type: string
    CodexConfigFile:
      type: object
      required: [scope, path, exists, readable, status, is_symlink]
      properties:
        scope:
          type: string
        path:
          type: string
        exists:
          type: boolean
        readable:
          type: boolean
        is_symlink:
          type: boolean
        status:
          type: string
    CodexInstructionFile:
      type: object
      required: [scope, path, exists, status, is_symlink]
      properties:
        scope:
          type: string
        path:
          type: string
        exists:
          type: boolean
        is_symlink:
          type: boolean
        status:
          type: string
    CodexSkill:
      type: object
      required: [name, description, scope, path, status, is_symlink]
      properties:
        name:
          type: string
        description:
          type: string
        scope:
          type: string
        path:
          type: string
        is_symlink:
          type: boolean
        status:
          type: string
    CodexMCPServer:
      type: object
      required: [name, scope, source, transport, command, status, auth_status, health_status]
      properties:
        name:
          type: string
        scope:
          type: string
          description: Effective merged configuration scope reported by Codex
        source:
          type: string
          description: Command or source used to collect the MCP configuration
        transport:
          type: string
        command:
          type: string
        status:
          type: string
        auth_status:
          type: string
        health_status:
          type: string
          description: MCP server health is intentionally not checked; configuration state only.
    CodexDiagnosticError:
      type: object
      required: [section, message]
      properties:
        section:
          type: string
        message:
          type: string
    HerdrWorkspace:
      type: object
      required: [workspace_id, label, agent_status]
      properties:
        workspace_id:
          type: string
        label:
          type: string
        number:
          type: integer
        agent_status:
          type: string
        focused:
          type: boolean
        tab_count:
          type: integer
        pane_count:
          type: integer
    HerdrAgent:
      type: object
      required: [name, status, workspace_id, pane_id]
      properties:
        name:
          type: string
        task_id:
          type: string
          description: Stable mybox task ID associated with this agent, when applicable.
        task_title:
          type: string
          description: Current mybox task title used as the Herdr tab label, when applicable.
        custom_name:
          type: string
        status:
          type: string
        workspace_id:
          type: string
        cwd:
          type: string
        title:
          type: string
        focused:
          type: boolean
        pane_id:
          type: string
    HerdrAgentStartRequest:
      type: object
      required: [kind, tab]
      properties:
        kind:
          type: string
          minLength: 1
        tab:
          type: string
          minLength: 1
          maxLength: 80
