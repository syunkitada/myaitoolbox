services:
  nginx:
    container_name: playground-nginx
    image: nginx:latest
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/conf.d/tls.conf:/etc/nginx/conf.d/tls.conf
      - /etc/mylabo/tls-assets/ca/ca-certs/ca.pem:/usr/share/nginx/download/ca.pem:ro
      - /etc/mylabo/tls-assets/svc.local.test/server.pem:/etc/nginx/ssl/server.pem
      - /etc/mylabo/tls-assets/svc.local.test/server-key.pem:/etc/nginx/ssl/server-key.pem
